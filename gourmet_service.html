<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gourmet Service</title>
<style>
:root{--bg:#121212;--card:#1E1E1E;--accent:#693DE2;--text:#FFFFFF;--sub:#8B39E7;--entry:#2A2A2A}
.light{--bg:#F4F4F9;--card:#FFFFFF;--accent:#1D46B9;--text:#222222;--sub:#0065D9;--entry:#FFFFFF}
*{box-sizing:border-box} body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.top{display:flex;justify-content:flex-end;padding:14px 20px}
.theme{background:transparent;color:var(--text);border:1px solid #666;border-radius:8px;padding:8px 14px;cursor:pointer}
.login-wrap{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:20px}
.login{width:min(430px,100%);background:var(--card);border:1px solid #333;border-radius:14px;padding:32px;box-shadow:0 10px 35px #0005}
h1{margin:0 0 6px;color:var(--accent);text-align:center}.subtitle{text-align:center;margin:0 0 22px}
label{display:block;font-weight:700;margin:13px 0 6px}input,select{width:100%;background:var(--entry);color:var(--text);border:1px solid #555;border-radius:7px;padding:11px}
.primary{width:100%;margin-top:22px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px;font-weight:700;cursor:pointer}
.header{background:var(--accent);padding:16px 22px}.header-row{display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{font-size:28px;font-weight:800}.client{margin-top:6px;font-weight:700}
.tabs{display:flex;gap:8px;padding:12px 15px 5px;overflow:auto}.tab{background:var(--card);color:var(--text);border:0;border-radius:8px 8px 0 0;padding:10px 15px;font-weight:700;cursor:pointer;white-space:nowrap}.tab.active{background:var(--accent);color:#fff}
.content{padding:10px 20px 150px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid #333;border-radius:10px;padding:14px;min-height:180px;display:flex;flex-direction:column}
.name{color:var(--sub);font-weight:800;font-size:17px}.desc{font-size:14px;margin:8px 0 15px;line-height:1.4;flex:1}
.ctrl{display:flex;justify-content:space-between;align-items:center}.qty{width:72px;text-align:center}
.footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid #333;padding:10px 20px;text-align:center}
.total{color:var(--accent);font-size:21px;font-weight:800;margin-bottom:8px}.actions{display:flex;justify-content:center;gap:12px}
.secondary{background:#555;color:#fff;border:0;border-radius:7px;padding:9px 14px;font-weight:700;cursor:pointer}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}.brand{font-size:21px}.login{padding:24px}}
</style>
</head>
<body><div id="app"></div>
<script>
const menu=[{"categoria": "🍔 HAMBÚRGUERES", "itens": [{"id": 101, "nome": "Poderoso Chefão", "preco": 34.9, "descricao": "Blend 180g, gorgonzola, cebola caramelizada e bacon."}, {"id": 102, "nome": "Clássico Smash", "preco": 22.0, "descricao": "Dois hambúrgueres smash de 80g, cheddar e picles."}, {"id": 103, "nome": "Veggie Supreme", "preco": 29.9, "descricao": "Hambúrguer de grão-de-bico, rúcula e maionese de ervas."}, {"id": 104, "nome": "Duplo Bacon", "preco": 38.5, "descricao": "Dois blends 180g, triplo bacon e molho barbecue."}, {"id": 105, "nome": "Chicken Crispy", "preco": 25.9, "descricao": "Frango crocante, salada coleslaw e maionese."}, {"id": 106, "nome": "Monster Burger", "preco": 44.0, "descricao": "Três blends 150g, quádruplo cheddar e anéis de cebola."}]}, {"categoria": "🍕 PIZZAS", "itens": [{"id": 201, "nome": "Calabresa", "preco": 45.0, "descricao": "Molho de tomate pelati, calabresa fatiada e cebola."}, {"id": 202, "nome": "Marguerita", "preco": 42.0, "descricao": "Muçarela de búfala, tomate e manjericão fresco."}, {"id": 203, "nome": "Quatro Queijos", "preco": 50.0, "descricao": "Muçarela, provolone, gorgonzola e parmesão."}, {"id": 204, "nome": "Frango Catupiry", "preco": 48.0, "descricao": "Frango desfiado temperado com legítimo Catupiry."}]}, {"categoria": "🍟 ACOMPANHAMENTOS", "itens": [{"id": 301, "nome": "Batata Rústica", "preco": 18.0, "descricao": "Corte caseiro com alecrim e páprica defumada."}, {"id": 302, "nome": "Onion Rings", "preco": 20.0, "descricao": "Anéis de cebola crocantes com molho barbecue."}, {"id": 303, "nome": "Batata Cheddar/Bacon", "preco": 28.0, "descricao": "Porção grande com cheddar cremoso e bacon."}]}, {"categoria": "🥤 BEBIDAS", "itens": [{"id": 401, "nome": "Soda Artesanal", "preco": 12.0, "descricao": "Frutas vermelhas, limão siciliano e gás (500ml)."}, {"id": 402, "nome": "Milkshake", "preco": 18.0, "descricao": "Morango, Chocolate ou Ovaltine (400ml)."}, {"id": 403, "nome": "Refrigerante", "preco": 6.5, "descricao": "Lata 350ml (Coca, Guaraná ou Sprite)."}]}];
let dark=true;
let cliente={nome:"",usuario:"",senha:"",pagamento:"PIX"};
let pedidos={};

function moeda(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function tema(){
  document.body.classList.toggle("light",!dark);
  const b=document.querySelector(".theme");
  if(b)b.textContent=dark?"☀️ Modo Claro":"🌙 Modo Escuro";
}
function login(){
document.getElementById("app").innerHTML=`
<div class="top"><button class="theme" onclick="dark=!dark;tema()">☀️ Modo Claro</button></div>
<div class="login-wrap"><div class="login">
<h1>🔥 AURA SERVICE 🔥</h1><p class="subtitle">Informe suas credenciais para acessar o cardápio</p>
<label>Nome Completo:</label><input id="nome" value="${cliente.nome}">
<label>Nome de Usuário:</label><input id="usuario" value="${cliente.usuario}">
<label>Senha:</label><input id="senha" type="password" value="${cliente.senha}">
<label>Forma de Pagamento:</label><select id="pagamento"><option>PIX</option><option>Cartão de Crédito</option><option>Cartão de Débito</option><option>Dinheiro</option></select>
<button class="primary" onclick="entrar()">ENTRAR NO CARDÁPIO ➔</button>
</div></div>`;
document.getElementById("pagamento").value=cliente.pagamento||"PIX";tema();
}
function entrar(){
const nome=document.getElementById("nome").value.trim(),usuario=document.getElementById("usuario").value.trim(),senha=document.getElementById("senha").value.trim(),pagamento=document.getElementById("pagamento").value;
if(!nome||!usuario||!senha){alert("Por favor, preencha o Nome, Usuário e Senha para continuar!");return;}
cliente={nome,usuario,senha,pagamento};cardapio();
}
function cardapio(){
pedidos={};
document.getElementById("app").innerHTML=`
<header class="header"><div class="header-row"><div class="brand">🔥 GOURMET SERVICE 🔥</div><button class="theme" onclick="dark=!dark;tema()">☀️ Modo Claro</button></div>
<div class="client">👤 ${cliente.nome} (@${cliente.usuario}) | 💳 ${cliente.pagamento}</div></header>
<nav class="tabs" id="tabs"></nav><main class="content"><div class="grid" id="grid"></div></main>
<footer class="footer"><div class="total" id="total">TOTAL: R$ 0,00</div><div class="actions">
<button class="secondary" onclick="login()">⬅ Alterar Login</button><button class="primary" style="width:auto;margin:0" onclick="finalizar()">FINALIZAR E SALVAR PEDIDO ➔</button></div></footer>`;
menu.forEach((cat,i)=>{const b=document.createElement("button");b.className="tab"+(i===0?" active":"");b.textContent=cat.categoria;b.onclick=()=>mostrarCategoria(i);document.getElementById("tabs").appendChild(b);});
mostrarCategoria(0);tema();
}
function mostrarCategoria(index){
document.querySelectorAll(".tab").forEach((b,i)=>b.classList.toggle("active",i===index));
const grid=document.getElementById("grid");grid.innerHTML="";
menu[index].itens.forEach(item=>{
pedidos[item.id]=pedidos[item.id]||0;
const card=document.createElement("div");card.className="card";
card.innerHTML=`<div class="name">${item.nome}<br>${moeda(item.preco)}</div><div class="desc">${item.descricao}</div>
<div class="ctrl"><span>Qtd:</span><input class="qty" type="number" min="0" max="99" value="${pedidos[item.id]}" data-id="${item.id}"></div>`;
const input=card.querySelector("input");
input.onchange=()=>{pedidos[item.id]=Math.max(0,Math.min(99,parseInt(input.value)||0));atualizarTotal();};
grid.appendChild(card);
});
atualizarTotal();
}
function atualizarTotal(){
let total=0;menu.forEach(cat=>cat.itens.forEach(item=>total+=(pedidos[item.id]||0)*item.preco));
const el=document.getElementById("total");if(el)el.textContent="TOTAL: "+moeda(total);
}
function finalizar(){
let itens=[],total=0;
menu.forEach(cat=>cat.itens.forEach(item=>{const qtd=pedidos[item.id]||0;if(qtd>0){const subtotal=qtd*item.preco;total+=subtotal;itens.push({item:item.nome,quantidade:qtd,preco_unitario:item.preco,subtotal:+subtotal.toFixed(2)});}}));
if(!itens.length){alert("Selecione pelo menos um item no cardápio!");return;}
const pedido={id_pedido:Math.floor(Date.now()/1000),data_hora:new Date().toLocaleString("sv-SE"),cliente:{nome:cliente.nome,usuario:cliente.usuario,forma_pagamento:cliente.pagamento},itens,total:+total.toFixed(2)};
const historico=JSON.parse(localStorage.getItem("pedidos")||"[]");historico.push(pedido);localStorage.setItem("pedidos",JSON.stringify(historico,null,2));
let resumo="📋 COMANDA REGISTRADA\n\nCliente: "+cliente.nome+"\nUsuário: @"+cliente.usuario+"\nPagamento: "+cliente.pagamento+"\n\n";
itens.forEach(x=>resumo+="• "+x.quantidade+"x "+x.item+" = "+moeda(x.subtotal)+"\n");
resumo+="\nTOTAL FINAL: "+moeda(total);
alert(resumo+"\n\n✅ Pedido finalizado e salvo no navegador!");
cliente={nome:"",usuario:"",senha:"",pagamento:"PIX"};login();
}
login();
</script></body></html>
